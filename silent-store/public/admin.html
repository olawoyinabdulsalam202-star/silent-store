<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#05070c" />
<meta name="robots" content="noindex,nofollow" />
<title>SILENT H4X | Admin</title>
<style>
:root{--bg:#05070c;--surface:#0b101a;--hover:#121a29;--border:rgba(43,217,24,.15);--glow:rgba(43,217,24,.4);--text:#f0f6ff;--muted:#7a8aa3;--cyan:#2bd918;--dim:rgba(43,217,24,.1);--gold:#ffb800;--red:#ff3b3b;--green:#6dff3d;--r:14px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-size:14px;padding-bottom:90px;overflow-x:hidden}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{cursor:pointer;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(5,7,12,.85);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand-area{display:flex;align-items:center;gap:10px}
.menu-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2bd918,#0a8a00);display:grid;place-items:center;font-weight:900;color:#000;font-size:19px;box-shadow:0 0 15px var(--glow)}
.brand-text h1{font-size:15px;font-weight:900;letter-spacing:1px}
.brand-text p{font-size:9px;color:var(--cyan);letter-spacing:1.5px;font-weight:700}
.wallet-pill{display:flex;align-items:center;gap:8px;background:var(--dim);border:1px solid var(--glow);padding:8px 14px;border-radius:24px;font-size:13px;font-weight:800;color:var(--cyan)}
.wallet-pill:active{transform:scale(.96)}
.ticker-wrap{background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);padding:10px 0;overflow:hidden;white-space:nowrap;position:relative}
.ticker-badge{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);color:#000;font-size:10px;font-weight:900;padding:0 12px;display:flex;align-items:center;gap:6px;z-index:2}
.dot{width:6px;height:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan);animation:pulse 2s infinite}
.ticker-badge .dot{background:#000;box-shadow:none}
@keyframes pulse{50%{opacity:.35}}
.ticker{display:inline-block;padding-left:120px;animation:tick 40s linear infinite;font-size:11px;font-weight:700;color:var(--muted)}
.ticker b{color:var(--text);margin:0 3px}.ticker i{color:var(--cyan);font-style:normal}
@keyframes tick{to{transform:translateX(-100%)}}
.container{padding:18px 16px;max-width:600px;margin:0 auto}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;font-weight:900;letter-spacing:1px}
.online{display:flex;align-items:center;gap:6px;color:var(--cyan);font-size:10px;background:var(--dim);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px;margin-bottom:12px;color:var(--muted)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);padding:13px 0;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:800}
.chip.on{background:var(--cyan);color:#000;border-color:var(--cyan)}
.sort{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.art{position:relative;aspect-ratio:1.2;display:grid;place-items:center;font-size:34px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.9)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,12,.85),transparent 55%)}
.tags{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:2}
.tag{font-size:9px;font-weight:900;padding:3px 7px;border-radius:4px}
.hot{background:var(--gold);color:#000}
.stock{background:rgba(0,0,0,.8);border:1px solid var(--border)}
.out{background:var(--red)}
.cb{padding:12px;flex:1;display:flex;flex-direction:column}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.game{background:var(--dim);color:var(--cyan);padding:3px 8px;border-radius:4px;font-size:9px;font-weight:800;border:1px solid var(--border)}
.rate{color:var(--gold);font-size:10px;font-weight:800}
.ct{font-size:14px;font-weight:900;margin-bottom:4px;line-height:1.2}
.cd{font-size:11px;color:var(--muted);margin-bottom:12px;flex:1}
.price{font-size:16px;font-weight:900;color:var(--cyan);margin-bottom:10px}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--cyan);color:#000;font-weight:900;font-size:12px;display:flex;justify-content:center;align-items:center;gap:6px;text-transform:uppercase}
.btn:active{transform:scale(.97)}
.btn.off{background:var(--hover);color:var(--muted);cursor:not-allowed;border:1px solid var(--border)}
.btn.ghost{background:var(--dim);color:var(--cyan);border:1px solid var(--glow)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.pt{font-size:14px;font-weight:900;margin-bottom:6px}
.ps{font-size:11px;color:var(--muted);margin-bottom:14px}
.bal{display:flex;align-items:center;gap:16px;padding:22px 20px;background:linear-gradient(135deg,#0b101a,#05070c);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.bal .ic{width:48px;height:48px;border-radius:12px;background:var(--dim);border:1px solid var(--glow);display:grid;place-items:center;color:var(--cyan)}
.bal p{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.bal h2{font-size:26px;font-weight:900}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.amt{padding:11px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-weight:800;font-size:12px}
.amt.on{border-color:var(--cyan);background:var(--dim);color:var(--cyan)}
.field{width:100%;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:12px;outline:none;font-size:14px}
.field:focus{border-color:var(--cyan)}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);margin-bottom:10px;width:100%;text-align:left}
.pm.on{border-color:var(--cyan);background:var(--dim)}
.pm .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#000;font-weight:900}
.pm h4{font-size:13px;font-weight:800}.pm p{font-size:10px;color:var(--muted)}
.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.tx:last-child{border-bottom:none}
.tx h4{font-size:13px;font-weight:800;margin-bottom:2px}.tx p{font-size:11px;color:var(--muted)}
.tx .a{font-weight:900;text-align:right;font-size:13px}
.plus{color:var(--green)}.minus{color:var(--text)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:14px}
.key{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.key::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.key.pending::before{background:var(--gold)}
.kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.kn{font-weight:900;font-size:14px}
.ks{font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px}
.ks.ok{background:rgba(109,255,61,.1);color:var(--green);border:1px solid rgba(109,255,61,.3)}
.ks.wait{background:rgba(255,184,0,.1);color:var(--gold);border:1px solid rgba(255,184,0,.3)}
.kd{font-size:11px;color:var(--muted);margin-bottom:10px}
.kv{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;word-break:break-all}
.kv button{background:none;border:none;color:var(--cyan);display:flex;gap:10px}
.ph{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.av{width:58px;height:58px;border-radius:50%;background:var(--cyan);color:#000;display:grid;place-items:center;font-size:24px;font-weight:900}
.ph h2{font-size:18px;font-weight:900;margin-bottom:6px}
.badge{font-size:9px;font-weight:900;padding:3px 8px;border-radius:4px;background:var(--dim);color:var(--cyan);border:1px solid var(--border);margin-right:6px}
.badge.g{background:rgba(109,255,61,.1);color:var(--green);border-color:rgba(109,255,61,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);padding:14px 8px;border-radius:12px;text-align:center}
.stat p{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:4px}
.stat h3{font-size:15px;font-weight:900}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);font-weight:600}
.row:last-child{border-bottom:none}.row b{color:var(--text);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:.25s}
.ov.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:var(--bg);border-right:1px solid var(--border);z-index:101;transform:translateX(-100%);transition:transform .3s;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 22px;overflow-y:auto;display:flex;flex-direction:column}
.sidebar.open{transform:none}
.sb-item{padding:13px 14px;border-radius:12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:12px;color:var(--muted);border:1px solid transparent;background:none;width:100%;text-align:left;margin-bottom:4px}
.sb-item.active{background:var(--surface);color:var(--text);border-color:var(--border)}
.arena{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:18px 0}
.arena h4{font-size:11px;font-weight:900;color:var(--gold);margin-bottom:12px}
.ar{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;font-size:12px;border:1px solid transparent}
.ar.me{border-color:var(--cyan);background:var(--dim)}
.rk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:11px;background:var(--hover);color:var(--muted)}
.rk.r1{background:var(--gold);color:#000}.rk.r2{background:#c0c0c0;color:#000}.rk.r3{background:#cd7f32;color:#000}
.ar span:nth-child(2){flex:1;font-weight:700}
.ar em{font-style:normal;color:var(--cyan);font-weight:900;font-family:ui-monospace,monospace;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,7,12,.96);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:50;backdrop-filter:blur(12px)}
.bn{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:10px;font-weight:800;gap:5px;background:none;border:none;position:relative;min-width:60px}
.bn.active{color:var(--cyan)}
.bn .n{position:absolute;top:-4px;right:10px;background:var(--gold);color:#000;font-size:9px;font-weight:900;border-radius:8px;padding:1px 5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.box{background:var(--surface);border:1px solid var(--border);padding:28px 22px;border-radius:20px;width:100%;max-width:380px;position:relative}
.box h3{font-size:20px;margin-bottom:6px;text-align:center;font-weight:900}
.box>p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
.cap{display:flex;gap:10px;margin-bottom:12px}
.cap .field{margin:0;flex:1}
.cap .q{background:var(--dim);border:1px solid var(--glow);color:var(--cyan);padding:0 14px;border-radius:10px;font-weight:900;display:flex;align-items:center;user-select:none}
.err{color:var(--red);font-size:12px;text-align:center;margin-bottom:10px;min-height:0}
.toggle{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.toggle button{background:none;border:none;color:var(--cyan);font-weight:800;font-size:12px}
.x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--glow);border-radius:20px 20px 0 0;z-index:150;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s;max-width:600px;margin:0 auto}
.sheet.open{transform:none}.sheet{max-height:92vh;overflow-y:auto}.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.imgup{display:grid;place-items:center;height:160px;border:1px dashed var(--glow);border-radius:12px;margin:12px 0;color:var(--cyan);font-weight:800;font-size:12px;overflow:hidden;cursor:pointer;background:var(--bg)}.imgup img{width:100%;height:100%;object-fit:cover}textarea.field{resize:vertical}.chk{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--glow);padding:11px 16px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:pop .25s}
.toast.bad{border-color:var(--red)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
img.logo{background:#fff;object-fit:contain;padding:2px}
body{background-image:radial-gradient(circle at 50% -10%,rgba(43,217,24,.14),transparent 55%);background-attachment:fixed}
#adminApp{position:fixed;inset:0;z-index:500;background:var(--bg);background-image:radial-gradient(circle at 50% -10%,rgba(43,217,24,.14),transparent 55%);overflow-y:auto}
.alogin{min-height:100%;display:grid;place-items:center;padding:20px}
.atop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(5,7,12,.88);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.asheet{z-index:620}
.toasts{z-index:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:9px;color:var(--muted);font-weight:700}
.bar i{display:block;width:100%;background:linear-gradient(var(--cyan),#0a8a00);border-radius:6px 6px 0 0;min-height:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:1px solid var(--border);border-radius:12px;padding:12px 12px 0;margin-bottom:12px;background:var(--bg)}
.plan .field{background:var(--surface)}
.banner{background:var(--dim);border-bottom:1px solid var(--border);color:var(--cyan);font-size:12px;font-weight:700;text-align:center;padding:9px 14px}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const API=(window.SH4X_API||'')+'/api';
let DB={products:[],coupons:[],settings:{},requests:[],orders:[],data:{}};
const PRODUCTS=[];
function sync(p){p.stock=p.plans.reduce((s,x)=>s+x.keys.length,0);p.price=Math.min(...p.plans.map(x=>x.price))}
let aMem='';
const aTok=()=>{try{return sessionStorage.getItem('sh4xAT')||aMem}catch(e){return aMem}};
async function aApi(path,o={}){
  const r=await fetch(API+'/admin'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+aTok()},body:o.body!==undefined?JSON.stringify(o.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){aUntil=0;aMem='';try{sessionStorage.removeItem('sh4xA');sessionStorage.removeItem('sh4xAT')}catch(e){}showLogin();throw new Error(j.error||'Session expired')}
  if(!r.ok)throw new Error(j.error||'Request failed');
  return j;
}
async function refresh(){
  const st=await aApi('/state');
  PRODUCTS.length=0;PRODUCTS.push(...st.products);
  DB=Object.assign(st,{products:PRODUCTS});
  PRODUCTS.forEach(sync);
}
async function run(fn,msg){
  try{const r=await fn();await refresh();aRender();if(msg)toast(msg);return r||true}
  catch(e){toast(e.message,1)}
}
function toast(t,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=t;$('#toasts').append(d);setTimeout(()=>d.remove(),2600)}
function readShot(f,mx=900,q=.6){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
const PAYD={acct:'9062150813',bank:'Moniepoint',name:'EUGENE SOMTOCHUKWU VALENTINE',wa:'2349062150813'};
const pay=()=>Object.assign({},PAYD,(DB.settings||{}).pay||{});
async function decide(id,ok){
  const r=await run(()=>aApi('/requests/'+encodeURIComponent(id)+'/decide',{method:'POST',body:{ok}}));
  if(r&&r.amt)toast(ok?'Approved. '+naira(r.amt)+' credited to '+r.name:'Request rejected');
}
/* ===== ADMIN PANEL ===== */
let aTab='dash',aTries=0,aLock=0,capCode='',aUntil=0,aQ='',F=null,C=null;
const sets=()=>DB.settings||(DB.settings={}),cps=()=>DB.coupons||(DB.coupons=[]),reqs=()=>DB.requests||(DB.requests=[]),ords=()=>DB.orders||(DB.orders=[]);
const aOn=()=>{try{if(+sessionStorage.getItem('sh4xA')>Date.now()&&aTok())return true}catch(e){}return aUntil>Date.now()&&!!aMem};
const aOpen=h=>{$('#aSheet').innerHTML=h;$('#aSheet').classList.add('open');$('#aOv').classList.add('open')};
const aClose=()=>{$('#aSheet').classList.remove('open');$('#aOv').classList.remove('open')};
const dstr=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const SRCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>';
const TABS=[['dash','Dashboard'],['prod','Products'],['pay','Payments'],['ord','Orders'],['cpn','Coupons'],['usr','Users'],['set','Settings']];
const DURS=['1 Hour','6 Hours','1 Day','3 Days','7 Days','15 Days','30 Days','Lifetime'];

function showLogin(){$('#aLogin').classList.remove('hidden');$('#aPanel').classList.add('hidden');$('#aCode').value='';$('#aCap').value='';$('#aErrMsg').textContent='';newCap()}
async function showPanel(){try{await refresh()}catch(e){if(!aOn())return;toast('Could not load data from the server',1)}$('#aLogin').classList.add('hidden');$('#aPanel').classList.remove('hidden');aRender()}
function newCap(){
  const c=$('#capCv'),x=c.getContext('2d'),ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  capCode='';x.fillStyle='#0b101a';x.fillRect(0,0,170,52);
  for(let i=0;i<9;i++){x.strokeStyle='rgba(43,217,24,'+(.2+Math.random()*.4)+')';x.beginPath();x.moveTo(Math.random()*170,Math.random()*52);x.lineTo(Math.random()*170,Math.random()*52);x.stroke()}
  for(let i=0;i<5;i++){const t=ch[Math.random()*ch.length|0];capCode+=t;x.save();x.translate(22+i*29,30+Math.random()*8-4);x.rotate((Math.random()-.5)*.6);x.font='bold '+(26+(Math.random()*6|0))+'px monospace';x.fillStyle=i%2?'#2bd918':'#f0f6ff';x.fillText(t,-9,8);x.restore()}
  for(let i=0;i<50;i++){x.fillStyle='rgba(255,255,255,.25)';x.fillRect(Math.random()*170,Math.random()*52,2,2)}
}
async function unlock(){
  const er=m=>{$('#aErrMsg').textContent=m};
  if(Date.now()<aLock)return er('Too many attempts. Try again in '+Math.ceil((aLock-Date.now())/1000)+'s.');
  if($('#aCap').value.trim().toUpperCase()!==capCode){newCap();$('#aCap').value='';return er('Wrong CAPTCHA. Try the new one.')}
  let r;
  try{
    const x=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#aCode').value.trim()})});
    r=await x.json().catch(()=>({}));
    if(!x.ok){if(++aTries>=5){aTries=0;aLock=Date.now()+60000}newCap();$('#aCap').value='';return er(r.error||'Invalid access code.')}
  }catch(e){return er('Could not reach the server.')}
  aTries=0;aUntil=r.until;aMem=r.token;try{sessionStorage.setItem('sh4xA',aUntil);sessionStorage.setItem('sh4xAT',r.token)}catch(e){}
  await showPanel();toast('Welcome back, admin');
}
function aRender(){
  if(!aOn()){showLogin();return}
  const np=reqs().filter(r=>r.status==='pending').length;
  $('#aTabs').innerHTML=TABS.map(([k,l])=>`<button class="chip ${k===aTab?'on':''}" data-act="tab" data-arg="${k}">${l}${k==='pay'&&np?' ('+np+')':''}</button>`).join('');
  $('#aBody').innerHTML=({dash:vDash,prod:vProd,pay:vPay,ord:vOrd,cpn:vCpn,usr:vUsr,set:vSet})[aTab]();
}

/* ---- Dashboard ---- */
function vDash(){
  const o=ords(),rev=o.reduce((s,x)=>s+(x.paid||0),0),pend=reqs().filter(r=>r.status==='pending');
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return{d:d.getTime(),l:d.toLocaleDateString([], {weekday:'short'}).slice(0,3),v:0}});
  o.forEach(x=>{const d=days.find(z=>x.at>=z.d&&x.at<z.d+864e5);if(d)d.v+=x.paid||0});
  const mx=Math.max(1,...days.map(d=>d.v)),week=days.reduce((s,d)=>s+d.v,0);
  const low=[];PRODUCTS.forEach(p=>p.plans.forEach(pl=>{if(pl.keys.length<=2)low.push({p,pl})}));
  const best=PRODUCTS.filter(p=>p.sold).sort((a,b)=>b.sold-a.sold).slice(0,3);
  return `<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><p>Revenue</p><h3>${naira(rev)}</h3></div><div class="stat"><p>Orders</p><h3>${o.length}</h3></div><div class="stat"><p>Customers</p><h3>${Object.keys(DB.data).length}</h3></div><div class="stat"><p>Pending payments</p><h3 style="color:${pend.length?'var(--gold)':'inherit'}">${pend.length}</h3></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"><button class="btn" data-act="newp">Add product</button><button class="btn ghost" data-act="newc">New coupon</button></div>
  <div class="panel"><div class="pt">Last 7 days · ${naira(week)}</div><div class="bars">${days.map(d=>`<div class="bar"><i style="height:${Math.round(d.v/mx*100)}%"></i><span>${d.l}</span></div>`).join('')}</div></div>
  <div class="panel"><div class="pt">Low stock</div>${low.length?low.map(x=>`<div class="row"><span>${esc(x.p.name)}${x.pl.label?' · '+esc(x.pl.label):''}</span><button class="chip" data-act="editp" data-arg="${x.p.id}" style="color:${x.pl.keys.length?'var(--gold)':'var(--red)'}">${x.pl.keys.length} left · Restock</button></div>`).join(''):'<div class="ps" style="margin:0">All products are well stocked.</div>'}</div>
  <div class="panel"><div class="pt">Best sellers</div>${best.length?best.map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${p.sold} sold</b></div>`).join(''):'<div class="ps" style="margin:0">No sales yet.</div>'}</div>`;
}

/* ---- Products ---- */
function vProd(){return `<div style="display:flex;gap:8px;margin-bottom:12px"><label class="search" style="flex:1;margin:0">${SRCH}<input id="aSearch" placeholder="Search products" value="${esc(aQ)}"></label><button class="btn" data-act="newp" style="width:auto;padding:0 18px">Add</button></div><div id="aList">${prodList()}</div>`}
function prodList(){
  const q=aQ.toLowerCase(),l=PRODUCTS.filter(p=>(p.name+p.game).toLowerCase().includes(q));
  return l.length?l.map(p=>{const dur=p.plans.length>1||p.plans[0].label;return `<div class="key" style="padding:12px 12px 12px 18px"><div style="display:flex;gap:12px;align-items:center"><img src="${p.img}" alt="" style="width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none"><div style="flex:1;min-width:0"><div class="kn" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div><div class="kd" style="margin:2px 0 6px">${esc(p.game)} · ${p.plans.length>1?'from ':''}${naira(p.price)}</div><div>${p.hot?'<span class="badge g">HOT</span>':''}${p.hidden?'<span class="badge" style="color:var(--muted)">HIDDEN</span>':''}<span class="badge" style="${p.stock?'':'color:var(--red);border-color:var(--red)'}">${p.stock} keys</span></div></div></div>${dur?`<div class="kd" style="margin:10px 0 0">${p.plans.map(x=>esc(x.label||'Standard')+' '+naira(x.price)+' ('+x.keys.length+')').join(' · ')}</div>`:''}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px"><button class="chip" data-act="editp" data-arg="${p.id}">Edit</button><button class="chip" data-act="hidep" data-arg="${p.id}">${p.hidden?'Show':'Hide'}</button><button class="chip" data-act="delp" data-arg="${p.id}" style="color:var(--red)">Delete</button></div></div>`}).join(''):'<div class="empty"><b>No products yet</b>Tap Add to create your first product.</div>';
}
function openProd(id){
  const e=id?PRODUCTS.find(p=>p.id==id):null;
  F={e,img:e?e.img:null,name:e?e.name:'',game:e?e.game:'',desc:e?e.desc:'',hot:e?!!e.hot:false,hidden:e?!!e.hidden:false,dur:e?(e.plans.length>1||!!e.plans[0].label):false,plans:e?e.plans.map(x=>({label:x.label,price:x.price,keys:x.keys.join('\n')})):[{label:'',price:'',keys:''}]};
  drawProd();
}
function readF(){
  if(!$('#fName'))return;
  Object.assign(F,{name:$('#fName').value,game:$('#fGame').value,desc:$('#fDesc').value,hot:$('#fHot').checked,hidden:$('#fHid').checked});
  F.plans=$$('#planBox .plan').map(r=>({label:r.querySelector('.pl-label')?r.querySelector('.pl-label').value:'',price:r.querySelector('.pl-price').value,keys:r.querySelector('.pl-keys').value}));
}
const planRow=(p,i)=>`<div class="plan">${F.dur?`<div class="two"><input class="field pl-label" list="durl" placeholder="Duration e.g. 1 Hour" value="${esc(p.label)}"><input class="field pl-price" type="number" inputmode="numeric" placeholder="₦ price" value="${esc(p.price)}"></div>`:`<input class="field pl-price" type="number" inputmode="numeric" placeholder="Price in ₦" value="${esc(p.price)}">`}<textarea class="field pl-keys" rows="3" placeholder="Keys, one per line. Stock is the number of keys.">${esc(p.keys)}</textarea>${F.dur&&F.plans.length>1?`<button class="chip" data-act="rmplan" data-arg="${i}" style="color:var(--red);margin-bottom:12px">Remove this duration</button>`:''}</div>`;
function drawProd(){
  aOpen(`<div class="pt" style="font-size:17px">${F.e?'Edit product':'Add product'}</div>
  <label class="imgup"><input type="file" accept="image/*" id="fImg" hidden><img id="fPrev" class="${F.img?'':'hidden'}" src="${F.img||''}" alt="Product image"><span id="fPh" class="${F.img?'hidden':''}">Tap to upload product image</span></label>
  <input class="field" id="fName" placeholder="Product name" value="${esc(F.name)}">
  <input class="field" id="fGame" list="gl" placeholder="Game or category (e.g. Free Fire)" value="${esc(F.game)}"><datalist id="gl">${[...new Set(PRODUCTS.map(p=>p.game))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
  <datalist id="durl">${DURS.map(d=>`<option value="${d}">`).join('')}</datalist>
  <textarea class="field" id="fDesc" rows="2" placeholder="Short description">${esc(F.desc)}</textarea>
  <label class="chk"><input type="checkbox" id="fDur" data-act="dur" ${F.dur?'checked':''}> Sell by key duration (1 hour, 4 days, 30 days…)</label>
  <div id="planBox">${F.plans.map(planRow).join('')}</div>
  ${F.dur?'<button class="btn ghost" data-act="addplan" style="margin-bottom:14px">+ Add another duration</button>':''}
  <label class="chk"><input type="checkbox" id="fHot" ${F.hot?'checked':''}> Mark as hot</label>
  <label class="chk"><input type="checkbox" id="fHid" ${F.hidden?'checked':''}> Hide from store</label>
  <div style="display:grid;gap:8px"><button class="btn" data-act="savep">${F.e?'Save changes':'Add product'}</button><button class="btn ghost" data-act="aclose">Cancel</button></div>`);
  $('#fImg').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{F.img=await readShot(f,800,.72);$('#fPrev').src=F.img;$('#fPrev').classList.remove('hidden');$('#fPh').classList.add('hidden')}catch(x){toast('Could not read that image',1)}};
}

/* ---- Payments ---- */
function vPay(){
  const rs=reqs().slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.at-a.at);
  return rs.length?rs.map(r=>{const u=DB.data[r.user];return `<div class="key ${r.status==='pending'?'pending':''}"><div class="kh"><span class="kn">${naira(r.amt)} from ${esc(r.name)}</span><span class="ks ${r.status==='approved'?'ok':r.status==='pending'?'wait':''}" ${r.status==='rejected'?'style="color:var(--red);border:1px solid var(--red)"':''}>${r.status}</span></div><div class="kd">Ref ${esc(r.id)} · ${dstr(r.at)}${u?' · '+esc(u.email):''}</div><div style="display:grid;grid-template-columns:${r.status==='pending'?'1fr 1fr 1fr':'1fr'};gap:8px"><button class="btn ghost" data-act="viewr" data-arg="${esc(r.id)}" style="padding:10px">Receipt</button>${r.status==='pending'?`<button class="btn" data-act="ap" data-arg="${esc(r.id)}" style="padding:10px">Approve</button><button class="btn ghost" data-act="rj" data-arg="${esc(r.id)}" style="padding:10px;color:var(--red);border-color:var(--red)">Reject</button>`:''}</div></div>`}).join(''):'<div class="empty"><b>No payment requests</b>New receipts appear here for approval.</div>';
}

/* ---- Orders ---- */
function vOrd(){const o=ords().filter(x=>x.id);return `<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><p>Orders</p><h3>${o.length}</h3></div><div class="stat"><p>Revenue</p><h3>${naira(o.reduce((s,x)=>s+(x.paid||0),0))}</h3></div></div><label class="search">${SRCH}<input id="aSearch" placeholder="Search customer, product, key" value="${esc(aQ)}"></label><div class="panel" id="aList">${ordList()}</div>`}
function ordList(){
  const q=aQ.toLowerCase(),l=ords().filter(x=>x.id&&((x.uname||'')+(x.p||'')+(x.plan||'')+(x.key||'')+(x.coupon||'')).toLowerCase().includes(q));
  return l.length?l.map(x=>`<div class="tx"><div><h4>${esc(x.p)}${x.plan?' · '+esc(x.plan):''}</h4><p>${esc(x.uname||x.n)} · ${dstr(x.at)}${x.coupon?' · coupon '+esc(x.coupon):''}</p><p style="font-family:ui-monospace,monospace;color:var(--text)">${esc(x.key||'')}</p></div><div class="a plus">${naira(x.paid||0)}</div></div>`).join(''):'<div class="empty">No orders found.</div>';
}

/* ---- Coupons ---- */
const cStatus=c=>!c.active?'Paused':(c.expires&&Date.now()>c.expires)?'Expired':(c.max&&(c.used||0)>=c.max)?'Used up':'Active';
function vCpn(){
  const l=cps();
  return `<button class="btn" data-act="newc" style="margin-bottom:14px">New coupon</button>`+(l.length?l.map(c=>{const st=cStatus(c);return `<div class="key ${st==='Active'?'':'pending'}"><div class="kh"><span class="kn" style="font-family:ui-monospace,monospace;letter-spacing:1px">${esc(c.code)}</span><span class="ks ${st==='Active'?'ok':'wait'}">${st}</span></div><div class="kd">${c.type==='percent'?c.value+'% off':naira(c.value)+' off'} · used ${c.used||0}${c.max?'/'+c.max:''}${c.min?' · min '+naira(c.min):''}${c.expires?' · expires '+new Date(c.expires).toLocaleDateString():''}${c.scope&&c.scope.length?' · '+c.scope.length+' product(s)':' · all products'}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><button class="chip" data-act="editc" data-arg="${esc(c.code)}">Edit</button><button class="chip" data-act="togc" data-arg="${esc(c.code)}">${c.active?'Pause':'Activate'}</button><button class="chip" data-act="delc" data-arg="${esc(c.code)}" style="color:var(--red)">Delete</button></div></div>`}).join(''):'<div class="empty"><b>No coupons yet</b>Create a discount code for your customers.</div>');
}
function openCpn(code){
  const e=code?cps().find(c=>c.code===code):null;
  C={e,code:e?e.code:'',type:e?e.type:'percent',value:e?e.value:'',min:e&&e.min?e.min:'',max:e&&e.max?e.max:'',exp:e&&e.expires?new Date(e.expires).toLocaleDateString('en-CA'):'',once:e?!!e.once:true,scope:e?(e.scope||[]).slice():[]};
  drawCpn();
}
function readC(){if(!$('#cCode'))return;Object.assign(C,{code:$('#cCode').value,value:$('#cVal').value,min:$('#cMin').value,max:$('#cMax').value,exp:$('#cExp').value,once:$('#cOnce').checked})}
function drawCpn(){
  aOpen(`<div class="pt" style="font-size:17px">${C.e?'Edit coupon':'New coupon'}</div>
  <div style="display:flex;gap:8px;margin-top:12px"><input class="field" id="cCode" placeholder="Code e.g. WELCOME10" value="${esc(C.code)}" style="text-transform:uppercase"><button class="btn ghost" data-act="cgen" style="width:96px;margin-bottom:12px">Generate</button></div>
  <div class="chips" style="margin-bottom:12px"><button class="chip ${C.type==='percent'?'on':''}" data-act="ctype" data-arg="percent">Percent off</button><button class="chip ${C.type==='fixed'?'on':''}" data-act="ctype" data-arg="fixed">Fixed ₦ off</button></div>
  <input class="field" id="cVal" type="number" inputmode="numeric" placeholder="${C.type==='percent'?'Percent (1-100)':'Amount in ₦'}" value="${esc(C.value)}">
  <div class="two"><input class="field" id="cMin" type="number" inputmode="numeric" placeholder="Min order ₦ (optional)" value="${esc(C.min)}"><input class="field" id="cMax" type="number" inputmode="numeric" placeholder="Max uses (optional)" value="${esc(C.max)}"></div>
  <div class="ps" style="margin-bottom:6px">Expires (optional)</div><input class="field" id="cExp" type="date" value="${esc(C.exp)}">
  <label class="chk"><input type="checkbox" id="cOnce" ${C.once?'checked':''}> One use per customer</label>
  <div class="ps" style="margin-bottom:8px">Applies to ${C.scope.length?C.scope.length+' selected product(s)':'all products'}. Tap to limit.</div>
  <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:12px">${PRODUCTS.map(p=>`<button class="chip ${C.scope.includes(p.id)?'on':''}" data-act="cscope" data-arg="${p.id}">${esc(p.name)}</button>`).join('')||'<span class="ps">Add products first.</span>'}</div>
  <div style="display:grid;gap:8px"><button class="btn" data-act="savec">Save coupon</button><button class="btn ghost" data-act="aclose">Cancel</button></div>`);
}

/* ---- Users ---- */
function vUsr(){return `<label class="search">${SRCH}<input id="aSearch" placeholder="Search customers" value="${esc(aQ)}"></label><div id="aList">${userList()}</div>`}
function userList(){
  const q=aQ.toLowerCase(),l=Object.entries(DB.data).filter(([k,u])=>(u.name+u.email).toLowerCase().includes(q));
  return l.length?l.map(([k,u])=>`<div class="key" style="padding:14px 14px 14px 18px"><div class="kh"><span class="kn">${esc(u.name)}${u.banned?' <span class="ks wait" style="color:var(--red);border:1px solid var(--red)">BANNED</span>':''}</span><b style="color:var(--cyan)">${naira(u.bal)}</b></div><div class="kd">${esc(u.email)} · ${u.orders} orders · spent ${naira(u.spent)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="chip" data-act="wallet" data-arg="${esc(k)}">Adjust wallet</button><button class="chip" data-act="ban" data-arg="${esc(k)}" style="${u.banned?'':'color:var(--red)'}">${u.banned?'Unban':'Ban'}</button></div></div>`).join(''):'<div class="empty"><b>No customers yet</b>Sign-ups appear here.</div>';
}

/* ---- Settings ---- */
function vSet(){
  const p=pay(),s=sets();
  return `<div class="panel"><div class="pt">Store announcement</div><div class="ps">Shown as a banner at the top of the store. Leave empty to hide it.</div><input class="field" id="sBan" style="margin:0" placeholder="e.g. 20% off all keys this weekend" value="${esc(s.banner||'')}"></div>
  <div class="panel"><div class="pt">Payment details</div><div class="ps">Customers see these when they top up.</div><input class="field" id="sBank" placeholder="Bank" value="${esc(p.bank)}"><input class="field" id="sAcct" inputmode="numeric" placeholder="Account number" value="${esc(p.acct)}"><input class="field" id="sName" placeholder="Account name" value="${esc(p.name)}"><input class="field" id="sWa" inputmode="numeric" placeholder="WhatsApp number with country code" value="${esc(p.wa)}"><input class="field" id="sMin" type="number" inputmode="numeric" placeholder="Minimum top-up ₦" style="margin:0" value="${esc(s.minTop||500)}"></div>
  <button class="btn" data-act="saveset">Save settings</button>`;
}

/* ---- Actions ---- */
const ACT={
  logout(){aUntil=0;aMem='';try{sessionStorage.removeItem('sh4xA');sessionStorage.removeItem('sh4xAT')}catch(e){}showLogin();toast('Logged out')},
  unlock,cap(){newCap();$('#aCap').value=''},
  aclose:aClose,
  async tab(g){aTab=g;aQ='';aRender();$('#adminApp').scrollTo(0,0);if(g!=='prod'&&g!=='set'){try{await refresh();if(aTab===g&&!$('#aSheet').classList.contains('open')&&!$('#aSearch'))aRender()}catch(e){}}},
  newp(){openProd()},editp(g){openProd(g)},
  hidep(g){const p=PRODUCTS.find(x=>x.id==g);return run(()=>aApi('/products/'+g,{method:'PATCH',body:{hidden:!p.hidden}}))},
  delp(g){const p=PRODUCTS.find(x=>x.id==g);aOpen(`<div class="pt" style="font-size:17px">Delete ${esc(p.name)}?</div><div class="ps">Its ${p.stock} unsold keys are removed too. Customers who already bought keep theirs.</div><div style="display:grid;gap:8px"><button class="btn" data-act="delp2" data-arg="${p.id}" style="background:var(--red);color:#fff">Delete product</button><button class="btn ghost" data-act="aclose">Keep it</button></div>`)},
  async delp2(g){if(await run(()=>aApi('/products/'+g,{method:'DELETE'}),'Product deleted'))aClose()},
  dur(g,t){readF();F.dur=t.checked;if(!F.dur)F.plans=[{price:F.plans[0].price,keys:F.plans[0].keys,label:''}];drawProd()},
  addplan(){readF();F.plans.push({label:'',price:'',keys:''});drawProd()},
  rmplan(g){readF();F.plans.splice(+g,1);drawProd()},
  async savep(){
    readF();const name=F.name.trim(),game=F.game.trim();
    if(!F.img)return toast('Add a product image',1);
    if(!name||!game)return toast('Name and game are required',1);
    const plans=[],seen=new Set();
    for(const p of F.plans){
      const label=F.dur?p.label.trim():'',price=+p.price;
      if(F.dur&&!label)return toast('Name every duration (e.g. 1 Hour)',1);
      if(seen.has(label.toLowerCase()))return toast('Each duration must be different',1);
      seen.add(label.toLowerCase());
      if(!(price>0))return toast('Enter a price above 0'+(label?' for '+label:''),1);
      plans.push({label,price,keys:p.keys.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)});
    }
    const body={name,game,desc:F.desc.trim(),img:F.img,hot:F.hot,hidden:F.hidden,plans},was=F.e;
    if(await run(()=>was?aApi('/products/'+was.id,{method:'PUT',body}):aApi('/products',{method:'POST',body}),was?'Product updated':'Product added'))aClose();
  },
  async viewr(g){const r=reqs().find(x=>x.id===g);if(!r)return;try{r.shot=(await aApi('/requests/'+encodeURIComponent(g)+'/shot')).shot}catch(e){return toast(e.message,1)}aOpen(`<div class="pt" style="font-size:17px">${naira(r.amt)} from ${esc(r.name)}</div><img src="${r.shot}" style="width:100%;border-radius:10px;border:1px solid var(--border);margin:8px 0 12px" alt="Payment receipt"><button class="btn ghost" data-act="aclose">Close</button>`)},
  ap(g){return decide(g,1)},rj(g){return decide(g,0)},
  newc(){openCpn()},editc(g){openCpn(g)},
  togc(g){return run(()=>aApi('/coupons/'+encodeURIComponent(g),{method:'PATCH'}))},
  delc(g){aOpen(`<div class="pt" style="font-size:17px">Delete coupon ${esc(g)}?</div><div style="display:grid;gap:8px;margin-top:14px"><button class="btn" data-act="delc2" data-arg="${esc(g)}" style="background:var(--red);color:#fff">Delete</button><button class="btn ghost" data-act="aclose">Keep it</button></div>`)},
  async delc2(g){if(await run(()=>aApi('/coupons/'+encodeURIComponent(g),{method:'DELETE'}),'Coupon deleted'))aClose()},
  ctype(g){readC();C.type=g;drawCpn()},
  cgen(){readC();const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';C.code=Array.from({length:8},()=>a[Math.random()*a.length|0]).join('');drawCpn()},
  cscope(g){readC();const id=+g,i=C.scope.indexOf(id);i<0?C.scope.push(id):C.scope.splice(i,1);drawCpn()},
  async savec(){
    readC();const code=C.code.trim().toUpperCase(),v=+C.value;
    if(!/^[A-Z0-9-]{3,20}$/.test(code))return toast('Code must be 3-20 letters, numbers or dashes',1);
    if(cps().some(c=>c.code===code&&(!C.e||c.code!==C.e.code)))return toast('That code already exists',1);
    if(!(v>0)||(C.type==='percent'&&v>100))return toast(C.type==='percent'?'Percent must be 1 to 100':'Enter an amount above 0',1);
    const o={code,type:C.type,value:v,min:+C.min||0,max:+C.max||0,expires:C.exp?new Date(C.exp+'T23:59:59').getTime():0,once:C.once,scope:C.scope};
    if(await run(()=>aApi('/coupons',{method:'POST',body:Object.assign({original:C.e?C.e.code:''},o)}),'Coupon saved'))aClose();
  },
  wallet(g){const u=DB.data[g];aOpen(`<div class="pt" style="font-size:17px">Adjust wallet · ${esc(u.name)}</div><div class="ps">Balance ${naira(u.bal)}. Use a negative number to deduct.</div><input class="field" id="wAmt" type="number" inputmode="numeric" placeholder="e.g. 2000 or -500"><input class="field" id="wNote" placeholder="Note (optional)"><div style="display:grid;gap:8px"><button class="btn" data-act="wsave" data-arg="${esc(g)}">Apply</button><button class="btn ghost" data-act="aclose">Cancel</button></div>`)},
  async wsave(g){const u=DB.data[g],n=Math.round(+$('#wAmt').value);if(!n)return toast('Enter an amount',1);if(u.bal+n<0)return toast('That would make the balance negative',1);if(await run(()=>aApi('/users/'+g+'/wallet',{method:'POST',body:{amt:n,note:$('#wNote').value.trim()}}),'Wallet updated'))aClose()},
  async ban(g){const r=await run(()=>aApi('/users/'+g+'/ban',{method:'POST'}));if(r&&r!==true)toast(r.banned?'Customer banned':'Customer unbanned')},
  async saveset(){
    const wa=$('#sWa').value.replace(/\D/g,'');if(!wa)return toast('Enter a WhatsApp number',1);
    const body={banner:$('#sBan').value.trim(),minTop:+$('#sMin').value||500,pay:{bank:$('#sBank').value.trim(),acct:$('#sAcct').value.trim(),name:$('#sName').value.trim(),wa}};
    await run(()=>aApi('/settings',{method:'PUT',body}),'Settings saved');
  }
};
$('#adminApp').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!ACT[t.dataset.act])return;ACT[t.dataset.act](t.dataset.arg,t)});
$('#adminApp').addEventListener('input',e=>{if(e.target.id!=='aSearch')return;aQ=e.target.value;$('#aList').innerHTML=aTab==='prod'?prodList():aTab==='ord'?ordList():userList()});
$('#aCap').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
$('#aOv').onclick=aClose;

setInterval(async()=>{
  if(!aOn()||$('#aPanel').classList.contains('hidden')||$('#aSheet').classList.contains('open')||!['dash','pay'].includes(aTab))return;
  try{await refresh();aRender()}catch(e){}
},45000);
aOn()?showPanel():showLogin();
</script>
</body>
</html>
